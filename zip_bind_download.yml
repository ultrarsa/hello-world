---
- name: Compress bind directory with date and download to local machine
  hosts: all
  become: yes
  vars:
    current_date: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"  # 獲取當前日期
  tasks:
    - name: Display message - Starting the playbook
      debug:
        msg: "Starting the playbook to compress /etc/bind and download it to the local machine."

    - name: Display message - Compressing the /etc/bind directory using tar
      debug:
        msg: "Compressing the /etc/bind directory into /tmp/bind_backup_{{ current_date }}.tar.gz on the remote host."

    - name: Compress /etc/bind directory into /tmp/bind_backup_{{ current_date }}.tar.gz using tar command
      command: tar -czvf /tmp/bind_backup_{{ current_date }}.tar.gz /etc/bind
      register: compress_result

    - name: Display message - Compression completed
      debug:
        msg: "Compression completed. Result: {{ compress_result }}"

    - name: Display message - Downloading the compressed file
      debug:
        msg: "Downloading the compressed file to the local machine (Windows Desktop)."

    - name: Download the compressed file to the local machine (Windows Desktop)
      fetch:
        src: "/tmp/bind_backup_{{ current_date }}.tar.gz"
        dest: "C:/Users/{{ lookup('env', 'USERNAME') }}/Desktop/"
        flat: yes
      register: fetch_result

    - name: Display message - File download completed
      debug:
        msg: "File download completed. Result: {{ fetch_result }}"

    - name: Display message - Removing the compressed file from remote host
      debug:
        msg: "Removing the compressed file from the remote host."

    - name: Remove the compressed file from the remote host
      file:
        path: "/tmp/bind_backup_{{ current_date }}.tar.gz"
        state: absent
      register: remove_result

    - name: Display message - File removal completed
      debug:
        msg: "File removal from remote host completed. Result: {{ remove_result }}"
