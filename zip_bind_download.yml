---
- name: Compress bind directory with date and download to local machine using SCP
  hosts: all
  become: yes
  vars:
    current_date: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"  # 獲取當前日期
    local_user: "{{ lookup('env', 'USERNAME') }}"  # 獲取本地端使用者名稱
    local_dest: "C:/Users/{{ local_user }}/Desktop"  # 本地端桌面路徑
    remote_file: "/tmp/bind_backup_{{ current_date }}.tar.gz"  # 遠端壓縮檔案路徑
  tasks:
    - name: Display message - Starting the playbook
      debug:
        msg: "Starting the playbook to compress /etc/bind and download it to the local machine."

    - name: Display message - Compressing the /etc/bind directory using tar
      debug:
        msg: "Compressing the /etc/bind directory into {{ remote_file }} on the remote host."

    - name: Compress /etc/bind directory into {{ remote_file }} using tar command
      command: tar -czvf {{ remote_file }} /etc/bind
      register: compress_result

    - name: Display message - Compression completed
      debug:
        msg: "Compression completed. Result: {{ compress_result }}"

    - name: Display message - Using SCP to download the compressed file
      debug:
        msg: "Downloading the compressed file {{ remote_file }} to {{ local_dest }} using SCP."

    - name: Download the compressed file using SCP
      local_action: shell scp user@{{ inventory_hostname }}:{{ remote_file }} {{ local_dest }}/
      args:
        executable: /bin/bash
      register: scp_result

    - name: Display message - SCP download completed
      debug:
        msg: "SCP download completed. Result: {{ scp_result }}"

    - name: Display message - Removing the compressed file from remote host
      debug:
        msg: "Removing the compressed file from the remote host."

    - name: Remove the compressed file from the remote host
      file:
        path: "{{ remote_file }}"
        state: absent
      register: remove_result

    - name: Display message - File removal completed
      debug:
        msg: "File removal from remote host completed. Result: {{ remove_result }}"
